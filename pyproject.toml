[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-agent-observability"
version = "0.1.0"
description = "Embeddable local-first tracing dashboard for FastAPI, LangChain, and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_agent_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
